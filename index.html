<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVAGARA - Acceso</title>
    <!-- Librería para manejo de Excel (Necesaria para el script global) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="images/ALVAGARA-copia.png" type="image/png">
    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NOTIFICACIONES (Se reutiliza en todas las páginas) -->
    <div id="toast-container"></div>

    <!-- VISTA LOGIN -->
    <div id="login-view" class="login-wrapper">
        <div class="login-container">
            <div class="logo">
                <img src="images/ALVAGARA.png" onerror="this.style.display='none'" alt="ALVAGARA Logo">
                <div id="text-logo" style="display:none; font-size: 40px; font-weight: bold; color: #53515a;">ALVAGARA</div>
            </div>
            
            <h1>Gestión</h1>
            <h2>Multi-Almacén</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="login-user" placeholder="Ingrese su usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="login-pass" placeholder="Contraseña" required>
                </div>
                
                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="button-container">
                    <button type="submit" class="button">
                        <span class="button-content">Ingresar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nuestro JS -->
    <script src="script.js"></script>
</body>
</html>
