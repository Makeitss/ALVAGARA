<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVAGARA - Gestión base de datos</title>
    <link rel="icon" href="images/ALVAGARA - copia.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #dfe1e7 0%, #7f7b83 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 30px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .button-back {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgb(20, 20, 20);
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4px rgba(180, 160, 255, 0.253);
            cursor: pointer;
            overflow: hidden;
            position: absolute;
            top: 20px;
            left: 20px;
            transition: all 0.3s ease;
        }

        .svgIcon {
            width: 14px;
            transition: all 0.3s ease;
            transform: rotate(-90deg);
        }

        .svgIcon path {
            fill: white;
        }

        .button-back::before {
            content: "Back";
            position: absolute;
            color: white;
            font-size: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        @media (hover: hover) {
            .button-back:hover {
                width: 70px;
                border-radius: 50px;
                background-color: rgb(160, 160, 160);
            }

            .button-back:hover .svgIcon {
                transform: translateY(-200%) rotate(-90deg);
            }

            .button-back:hover::before {
                font-size: 13px;
                opacity: 1;
            }
        }

        .button-back:active {
            transform: scale(0.95);
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border: none;
            border-radius: 50px;
            background-color: #e8e8e8;
            font-size: 16px;
            outline: none;
            transition: background-color 0.3s;
        }

        input[type="text"]:focus {
            background-color: #d8d8d8;
        }

        .button {
            position: relative;
            margin-top: 20px;
            overflow: hidden;
            height: 3rem;
            padding: 0 4rem;
            border-radius: 1.5rem;
            background: #53515a;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(0);
            transform-origin: 0 50%;
            width: 100%;
            height: inherit;
            border-radius: inherit;
            background: linear-gradient(82.3deg, rgb(85, 85, 88) 10.8%, #dddddf 94.3%);
            transition: all 0.475s;
        }

        .button:hover::before {
            transform: scaleX(1);
        }

        .button-content {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 40px 30px;
            }

            h3 {
                font-size: 14px;
            }

            .button {
                width: 100%;
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">

        <button class="button-back" onclick="window.location.href='index.html'">
            <svg class="svgIcon" viewBox="0 0 384 512">
                <path d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"></path>
            </svg>
        </button>

        <div class="logo">
            <img src="images/ALVAGARA.png" alt="ALVAGARA Logo">
        </div>

        <form action="codigo.html">
            <div class="form-group">
                <input type="text" placeholder="ejemplo@gmail.com" required>
            </div>

            <h3>Ingresa tu correo, en unos momentos te enviaremos un código de verificación</h3>

            <button class="button" type="submit">
                <span class="button-content">Enviar</span>
            </button>
        </form>
    </div>
</body>
</html>
